      models:
        - "ChatGPT 5.6 Sol"
        - "Claude Fable"
      framework: "Codex and Claude Code"
      tool_setup: >-
        AI agents were used to evaluate variout proof strategies for amenability
        to formalization.  Once a strategy was decided, AI agents were used 
        extensively to author, audit, repair and refactor the Lean development.
        Agents from different vendors were used to cross-check each others work
        against the source material, theorem statements, and proof plan.
      cost:
        wall_time: "~60 hours over the course of 4 weeks of part-time development"
        spend_usd: "subscription-based. Maxed quotas for a $100 subscription, so ~$100"
        hardware: "API-hosted models with local Lean builds"
      prompting_notes: >-        
        Development was human-directed rather than a single autonomous proof
        run. Prompts typically specified a mathematical subproblem or desired
        API, supplied relevant source material and existing Lean context.  Humans provided
        guidance when agents were having trouble making progress, or when weaknesses in 
        the proof emerged. Subsequent agents were frequently used to audit definitions, remove
        placeholders, simplify long proofs, and repair integration issues.

    - method: "manual"
      models: []
      framework: "Lean 4, Mathlib, VS Code"
      tool_setup: >-
        Human work included choosing the theorem and sources, designing and
        revising the proof architecture, interpreting the classical topology,
        reviewing formal definitions for mathematical faithfulness, directing
        agent work, resolving architectural problems.
      cost:
        wall_time: "~10 hours over the course of 4 weeks"
        spend_usd: ""
        hardware: "local development workstation"
      prompting_notes: "n/a"

  spend_usd: "~$100"
  notes: >-
    This was a human-directed autoformalization project undertaken through the
    SF Lean meetup. Most of the Lean implementation was produced with AI coding
    agents, while the human formalizers selected and interpreted mathematical
    sources, determined the proof strategy and formal interfaces, reviewed
    definitions and theorem statements, and directed repeated implementation
