fidelity:
  divergences: >-
    The formalization targets the exact Lean Eval theorem rather than
    a single textbook statement verbatim. Its hypotheses and conclusion
    therefore use Mathlib's `ChartedSpace`, `IsManifold`, and homeomorphism
    structures and the canonical quotient types supplied by the benchmark.

    The proof combines material from more than one classical presentation.
    The topological and triangulation stage follows a Moise–Radó approach,
    while the finite polygonal normalization is organized around the
    Gallier–Xu approach. The Lean proof is consequently not a
    line-by-line translation of either source.

    The theorem allows surfaces with boundary through the Euclidean-half-space
    manifold model, which are treated only cursorily in the source material. 
    Its canonical representatives are the benchmark's quotient
    types `OrientableRel` and `NonOrientableRel`, rather than the connected-sum
    notation often used in textbook statements.

    Most importantly, the compared theorem proves existence of a canonical
    representative but not uniqueness of the parameters. The development does
    not claim the converse classification statement that distinct canonical
    invariants yield non-homeomorphic surfaces.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The theorem statement has been audited against the trusted Lean Eval
    challenge and is checked mechanically by Comparator. The complete public
    classification proof contains no unresolved `sorry`. The development has
    also undergone repeated human- and agent-directed audits of theorem
    statements, definitions, proof dependencies, and placeholder assumptions.
    It has not undergone independent expert peer review or Mathlib review of
    the entire API.

alignment:
  namespace: "Submission"
  statements:
    - source: >-
        Lean Eval `topological_classification_of_surfaces` challenge theorem
        `classification_of_surfaces`
      lean: "Submission.classification_of_surfaces"
      module: "Submission"
      status: "proved"
      note: >-
        Exact Comparator-facing proof of the trusted Lean Eval challenge
        theorem.

    - source: >-
        Classification of compact connected surfaces via triangulation and
        polygonal normal forms
      lean: "LeanEval.Topology.ClassificationOfSurfaces.classification_of_surfaces"
      module: "Submission.ClassificationOfSurfaces.EvalStatement"
      status: "proved"
      note: >-
        The maintained project theorem copied into the standalone Lean Eval
        workspace. It is obtained through the faithful chain from geometric
        triangulations to finite cyclic presentations, normalization to a
        canonical presentation, and realization by the benchmark quotient
        surfaces.

