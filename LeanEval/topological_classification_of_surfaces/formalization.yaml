# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "Classification of compact surfaces in Lean"
  description: >-
    A Lean 4 formalization of the classification theorem for compact connected
    topological 2-manifolds, including surfaces with boundary. The main theorem
    proves that every compact connected Hausdorff 2-manifold modeled on the
    Euclidean half-plane is homeomorphic to the sphere, an orientable canonical
    quotient surface, or a non-orientable canonical quotient surface. The
    submitted theorem is the exact statement of the Lean Eval
    `topological_classification_of_surfaces` challenge.
  authors:
    - "Ryan McCorvie"
    - "Jack McCarthy"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ryan McCorvie"

# This repository contains the substantive proof development, rather than merely
# wrapping another formalization, so `repository.substantive_formalization` is
# intentionally omitted.

classification:
  arxiv:
    - "math.GT"
  msc2020:
    - "57K20"

sources:
  - title: "Topological classification of surfaces"
    contributors:
      - name: "Junyan Xu"
        role: "Lean Eval problem proposer"
    id: "https://lean-lang.org/eval/problems/topological_classification_of_surfaces/"
    type: "formalization challenge"
    relationship: "formalizes"
    note: >-
      The submitted Comparator theorem is the exact theorem statement of this
      Lean Eval challenge. It classifies compact connected Hausdorff
      2-manifolds, including manifolds with boundary, into the canonical
      representatives supplied by the challenge.
    author_endorsement: "n/a"

  - title: "A Guide to the Classification Theorem for Compact Surfaces"
    authors:
      - "Jean Gallier"
      - "Dianna Xu"
    id: "https://doi.org/10.1007/978-3-642-34364-3"
    type: "book"
    location: >-
      Chapter 7, "The Classification Theorem for Compact Surfaces",
      pp. 79–103, together with the preceding development of triangulations.
    relationship: "adapts"
    note: >-
      Principal source for the combinatorial classification and polygonal
      normal-form stage. The Lean development uses finite cyclic presentations
      and proves that the normalizing moves preserve their polygonal
      realizations.
    author_endorsement: "not-contacted"

  - title: "Geometric Topology in Dimensions 2 and 3"
    authors:
      - "Edwin E. Moise"
    id: "https://doi.org/10.1007/978-1-4612-9906-6"
    type: "book"
    location: >-
      Chapter 8, "The triangulation theorem for 2-manifolds", pp. 58–64,
      and Chapter 22, "The classification of compact connected
      2-manifolds", beginning p. 155.
    relationship: "adapts"
    note: >-
      Principal source for the topological and triangulation side of the proof.
      The formal development follows a Moise–Radó from a topological
      surface to a faithful finite geometric triangulation before passing to
      the combinatorial classification.
    author_endorsement: "n/a"

related_formalizations: []

status:
  scope: >-
    The project proves the exact Lean Eval
    `topological_classification_of_surfaces` theorem. For a compact,
    connected, Hausdorff topological space equipped with the structure of a
    2-manifold modeled on `EuclideanHalfSpace 2`, it proves that the surface is
    homeomorphic either to the 2-sphere, to one of the orientable quotient
    representatives `Quot (OrientableRel p n)`, or to one of the
    non-orientable quotient representatives `Quot (NonOrientableRel p n)`,
    with the nondegeneracy conditions on the parameters appearing in the
    benchmark statement.

    The proof includes the triangulation and polygonal-normalization machinery
    needed to obtain these representatives.  The topological realization is related to
    a finite cyclic presentation, normalization preserves its polygonal
    realization, and canonical presentations are identified with the exact
    quotient surfaces used in the Lean Eval challenge.

    The result is an existence theorem. It does not prove uniqueness of the
    canonical parameters, nor does it formalize the usual corollary that two
    canonical surfaces are homeomorphic only when their orientability, genus
    or crosscap number, and number of boundary components agree. It only proves
    the existence/classification direction required by Lean Eval. There is no 
    homology or Euler characteristic in this proof.

  sorry_count: 0
  sorry_in_definitions: 0

  # Verify these once more with `#print axioms` before submission.
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"

  main_results:
    - declaration: "Submission.classification_of_surfaces"
      file: "Submission.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "config.json"
      literature_dependencies: []

