name = "ClassificationOfSurfaces"
version = "0.2.0"
keywords = ["math", "topology", "lean-eval"]
defaultTargets = ["ClassificationOfSurfaces", "JordanCurve"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3



[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "905b95818eb32af7874a58b427f50c1711a5e96c"


[[lean_lib]]
name = "ClassificationOfSurfaces"
# Keep full build coverage independent of the public and umbrella import graphs.
globs = ["ClassificationOfSurfaces.*"]

[[lean_lib]]
name = "JordanCurve"
