name = "ClassificationOfSurfaces"
version = "0.2.0"
keywords = ["math", "topology", "lean-eval"]
defaultTargets = ["ClassificationOfSurfaces", "JordanCurve", "Schoenflies"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3



[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "81a5d257c8e410db227a6665ed08f64fea08e997"

[[lean_lib]]
name = "ClassificationOfSurfaces"

[[lean_lib]]
name = "JordanCurve"

[[lean_lib]]
name = "Schoenflies"
